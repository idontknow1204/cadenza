name: CadenzaConnectionsTests
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    path: ${CADENZA_ROOT}/build/SourcePackages/checkouts/supabase-swift
targets:
  CadenzaConnectionsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../ConnectionRepositoryTests.swift
      - ../ConnectionStoreTests.swift
      - ../../Cadenza/Core/ConnectionStore.swift
      - ../../Cadenza/Core/Models.swift
      - ../../Cadenza/Core/AppLocalization.swift
      - ../../Cadenza/Core/Repository.swift
      - ../../Cadenza/Core/SessionStore.swift
      - ../../Cadenza/Core/AppConfig.swift
      - ../../Cadenza/Features/Activity/InstagramImportView.swift
    dependencies:
      - package: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cadenza.connection-tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  CadenzaConnectionsTests:
    build:
      targets:
        CadenzaConnectionsTests: all
    test:
      targets: [CadenzaConnectionsTests]
