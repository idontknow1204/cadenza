name: Cadenza
options:
  bundleIdPrefix: com.cadenza
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Cadenza:
    type: application
    platform: iOS
    sources:
      - path: Cadenza
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Cadenza/Info.plist
      properties:
        CFBundleDisplayName: Cadenza
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - cadenza
            CFBundleURLName: com.cadenza.app.kkiri-coporation
        CFBundleLocalizations: [ko, en, de]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSContactsUsageDescription: "지인을 찾아 팔로우를 추천하기 위해 연락처를 사용합니다."
        NSCameraUsageDescription: "공연 포스터·티켓 증빙을 촬영하기 위해 카메라를 사용합니다."
        NSPhotoLibraryUsageDescription: "공연 활동 기록에 사진을 첨부하기 위해 사진 라이브러리에 접근합니다."
    entitlements:
      path: Cadenza/Cadenza.entitlements
      properties:
        aps-environment: production
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cadenza.app.kkiri-coporation
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
