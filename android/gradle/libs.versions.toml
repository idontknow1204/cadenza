[versions]
agp                   = "8.5.2"
kotlin                = "2.0.20"
ksp                   = "2.0.20-1.0.25"
compose-bom           = "2024.09.03"
hilt                  = "2.51.1"
hilt-navigation       = "1.2.0"
supabase              = "2.5.4"
ktor                  = "2.3.12"
coil                  = "3.0.4"
navigation            = "2.8.3"
room                  = "2.6.1"
datastore             = "1.1.1"
coroutines            = "1.9.0"
mlkit-translate       = "17.0.3"
kotlinx-serialization = "1.7.3"
lifecycle             = "2.8.6"
activity              = "1.9.2"
core-ktx              = "1.13.1"

[libraries]
# AndroidX Core
androidx-core-ktx                  = { group = "androidx.core",      name = "core-ktx",                version.ref = "core-ktx"  }
androidx-lifecycle-runtime-ktx     = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",   version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx   = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose          = { group = "androidx.activity",  name = "activity-compose",        version.ref = "activity"  }

# Compose BOM
compose-bom            = { group = "androidx.compose", name = "compose-bom",         version.ref = "compose-bom" }
compose-ui             = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics    = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling     = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3      = { group = "androidx.compose.material3", name = "material3" }
compose-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Hilt
hilt-android           = { group = "com.google.dagger", name = "hilt-android",           version.ref = "hilt" }
hilt-compiler          = { group = "com.google.dagger", name = "hilt-compiler",           version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt",   name = "hilt-navigation-compose", version.ref = "hilt-navigation" }

# Supabase
supabase-bom       = { group = "io.github.jan-tennert.supabase", name = "bom",          version.ref = "supabase" }
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
supabase-auth      = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
supabase-realtime  = { group = "io.github.jan-tennert.supabase", name = "realtime-kt" }
supabase-storage   = { group = "io.github.jan-tennert.supabase", name = "storage-kt" }
supabase-functions = { group = "io.github.jan-tennert.supabase", name = "functions-kt" }
ktor-client-android = { group = "io.ktor", name = "ktor-client-android",               version.ref = "ktor" }

# Coil 3
coil-compose         = { group = "io.coil-kt.coil3", name = "coil-compose",        version.ref = "coil" }
coil-network-ktor    = { group = "io.coil-kt.coil3", name = "coil-network-ktor",   version.ref = "coil" }

# Room
room-runtime  = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx      = { group = "androidx.room", name = "room-ktx",     version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Coroutines
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# ML Kit Translation (피드 게시글 번역 — Apple Translation 대체)
mlkit-translate = { group = "com.google.mlkit", name = "translate", version.ref = "mlkit-translate" }

# kotlinx.serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Test
junit = { group = "junit", name = "junit", version = "4.13.2" }

[plugins]
android-application   = { id = "com.android.application",                   version.ref = "agp"    }
android-library       = { id = "com.android.library",                        version.ref = "agp"    }
kotlin-android        = { id = "org.jetbrains.kotlin.android",               version.ref = "kotlin" }
kotlin-compose        = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
hilt                  = { id = "com.google.dagger.hilt.android",             version.ref = "hilt"   }
ksp                   = { id = "com.google.devtools.ksp",                    version.ref = "ksp"    }
