name: CadenzaComposerUI
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  CadenzaComposerUI:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ../RecordComposerUITests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cadenza.composer-tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  CadenzaComposerUI:
    build:
      targets:
        CadenzaComposerUI: all
    test:
      targets: [CadenzaComposerUI]
