name: CadenzaActivitiesUI
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  CadenzaActivitiesUI:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ../ProfileActivitiesUITests.swift
      - ../PublicProfileLocalizationUITests.swift
      - ../NotificationsUITests.swift
      - ../FeedRefreshUITests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cadenza.activities-tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  CadenzaActivitiesUI:
    build:
      targets:
        CadenzaActivitiesUI: all
    test:
      targets: [CadenzaActivitiesUI]
